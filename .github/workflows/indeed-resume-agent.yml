name: Build — ASIATI Resume Agent

on:
  push:
    branches: [main]
    paths:
      - "tools/indeed_resume_agent/**"
      - "app/domains/candidate_ingestion/indeed_agent_*.py"
      - "app/domains/candidate_ingestion/indeed_email_agent_service.py"
      - ".github/workflows/indeed-resume-agent.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: resume-agent-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-build:
    name: Windows onedir artifact
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Create build environment
        shell: powershell
        run: |
          python -m venv .agent-venv
          .\.agent-venv\Scripts\python.exe -m pip install --upgrade pip
          .\.agent-venv\Scripts\pip.exe install -r .\tools\indeed_resume_agent\requirements.txt
          .\.agent-venv\Scripts\pip.exe install pytest
      - name: Packaging contract tests
        shell: powershell
        run: .\.agent-venv\Scripts\python.exe -m pytest -q tools\indeed_resume_agent\tests\test_packaging_contract.py tools\indeed_resume_agent\tests\test_ci_workflow_contract.py
      - name: Build Windows agent
        shell: powershell
        run: .\tools\indeed_resume_agent\build.ps1
      - name: Verify executable
        shell: powershell
        run: |
          $Exe = ".\dist\ASIATI Resume Agent\ASIATI Resume Agent.exe"
          if (-not (Test-Path $Exe)) { throw "Windows executable was not created" }
          Get-Item $Exe | Format-List Name,Length,FullName
      - name: Execute packaged binary self-test
        shell: powershell
        run: |
          $Exe = ".\dist\ASIATI Resume Agent\ASIATI Resume Agent.exe"
          $Process = Start-Process -FilePath $Exe -ArgumentList "--self-test" -Wait -PassThru
          if ($Process.ExitCode -ne 0) {
            throw "Packaged Resume Agent self-test failed with exit code $($Process.ExitCode)"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ASIATI-Resume-Agent-Windows
          path: dist/ASIATI Resume Agent/**
          if-no-files-found: error
          retention-days: 14
