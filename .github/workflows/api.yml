name: API CI/CD

on:
  pull_request:
    branches: [main]
    paths:
      - "main.py"
      - "Dockerfile"
      - "api-task-definition.json"
      - "requirements.txt"
      - ".github/workflows/api.yml"
  push:
    branches: [main]
    paths:
      - "main.py"
      - "Dockerfile"
      - "api-task-definition.json"
      - "requirements.txt"
      - ".github/workflows/api.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-api
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ai-recruiter
  ECS_CLUSTER: ai-recruiter-cluster
  ECS_SERVICE: ai-recruiter-api-v2
  ECS_CONTAINER: Main

jobs:
  validate:
    name: Validate API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Python syntax
        run: python -m py_compile main.py
      - name: Validate task definition JSON
        run: python -m json.tool api-task-definition.json > /dev/null
      - name: Build API image
        run: docker build --tag api-ci:${{ github.sha }} .

  deploy:
    name: Deploy API
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          docker build --tag "$IMAGE_URI" .
          docker push "$IMAGE_URI"

          echo "uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Render ECS Task Definition
        id: task-def
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
        run: |
          jq \
          --arg IMAGE "$IMAGE_URI" \
          '.containerDefinitions[0].image=$IMAGE' \
          api-task-definition.json > api-task-definition-rendered.json

      - name: Register ECS Task Definition
        id: register-task
        run: |
          TASK_DEFINITION=$(aws ecs register-task-definition \
            --cli-input-json file://api-task-definition-rendered.json \
            --region "$AWS_REGION" \
            --query "taskDefinition.taskDefinitionArn" \
            --output text)

          echo "task_definition=$TASK_DEFINITION" >> "$GITHUB_OUTPUT"

      - name: Update ECS Service
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "${{ steps.register-task.outputs.task_definition }}" \
            --region "$AWS_REGION"

      - name: Wait for ECS deployment
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION"
