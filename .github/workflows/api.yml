name: API CI/CD (Lightsail)
on:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "Dockerfile"
      - "requirements.txt"
      - ".github/workflows/api.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "Dockerfile"
      - "requirements.txt"
      - ".github/workflows/api.yml"
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: production-api
  cancel-in-progress: false
env:
  AWS_REGION: us-east-2
  AWS_ACCOUNT_ID: "765761474007"
  ECR_REPOSITORY: ai-recruiter-api
  LIGHTSAIL_INSTANCE: ai-recruiter-api-v3
jobs:
  validate:
    name: Validate API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install deps
        run: pip install -r requirements.txt pytest
      - name: Validate syntax
        run: python -m py_compile app/main.py
      - name: Run tests
        env:
          DATABASE_URL: "sqlite:///:memory:"
        run: python -m pytest app/tests/ -v --tb=short
  deploy:
    name: Deploy to Lightsail
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Login ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build --tag "$IMAGE_URI" --tag "$ECR_REGISTRY/$ECR_REPOSITORY:latest" .
          docker push "$IMAGE_URI"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          echo "uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"
      - name: Deploy to instance
        run: |
          # Get instance IP
          INSTANCE_IP=$(aws lightsail get-instance \
            --instance-name $LIGHTSAIL_INSTANCE \
            --region $AWS_REGION \
            --query "instance.publicIpAddress" \
            --output text)
          echo "Instance IP: $INSTANCE_IP"

          # Get SSH key
          KEY_FILE="/tmp/lightsail-key.pem"
          aws lightsail download-default-key-pair \
            --region $AWS_REGION \
            --query "privateKeyBase64" \
            --output text > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          # Deploy to instance (ECR login runs on the instance itself)
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i "$KEY_FILE" ubuntu@$INSTANCE_IP \
            "aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY && \
             docker pull $ECR_REGISTRY/$ECR_REPOSITORY:latest && \
             docker rm -f ai-recruiter 2>/dev/null; \
             docker run -d --name ai-recruiter --restart unless-stopped \
               -p 80:80 -e DATABASE_URL='${{ secrets.DATABASE_URL }}' \
               $ECR_REGISTRY/$ECR_REPOSITORY:latest"

          # Wait and verify health
          sleep 30
          HTTP_CODE=$(curl -sf -o /dev/null -w "%{http_code}" http://$INSTANCE_IP/health || echo "000")
          echo "Health check: HTTP $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "WARNING: Health check failed"
          fi
      - name: Verify deployment
        run: |
          curl -sf http://api.adrianguerra.net/health | python -m json.tool
