name: API CI/CD

on:
  pull_request:
    branches: [main]
    paths:
      - "main.py"
      - "Dockerfile"
      - "api-task-definition.json"
      - "requirements.txt"
      - ".github/workflows/api.yml"
  push:
    branches: [main]
    paths:
      - "main.py"
      - "Dockerfile"
      - "api-task-definition.json"
      - "requirements.txt"
      - ".github/workflows/api.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-api
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ai-recruiter
  ECS_CLUSTER: ai-recruiter-cluster
  ECS_SERVICE: ai-recruiter-api-new
  ECS_CONTAINER: Main

jobs:
  validate:
    name: Validate API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Python syntax
        run: python -m py_compile main.py
      - name: Validate task definition JSON
        run: python -m json.tool api-task-definition.json > /dev/null
      - name: Build API image
        run: docker build --tag api-ci:${{ github.sha }} .

  deploy:
    name: Deploy API
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          docker build --tag "$IMAGE_URI" .
          docker push "$IMAGE_URI"

          echo "uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Update ECS Express Gateway Service
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
        run: |
          aws ecs update-express-gateway-service \
            --service-arn "arn:aws:ecs:${AWS_REGION}:765761474007:service/${ECS_CLUSTER}/${ECS_SERVICE}" \
            --primary-container "name=Main,image=$IMAGE_URI,containerPort=8000" \
            --health-check-path "/" \
            --region "$AWS_REGION"

      - name: Wait for deployment
        run: |
          echo "Waiting for ECS Express Gateway deployment..."

          for i in {1..30}; do
            STATUS=$(aws ecs describe-express-gateway-service \
              --service-arn "arn:aws:ecs:${AWS_REGION}:765761474007:service/${ECS_CLUSTER}/${ECS_SERVICE}" \
              --region "$AWS_REGION" \
              --query "service.status.statusCode" \
              --output text)

            echo "Service status: $STATUS"

            if [ "$STATUS" = "ACTIVE" ]; then
              break
            fi

            sleep 10
          done
