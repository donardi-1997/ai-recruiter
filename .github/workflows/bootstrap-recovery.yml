name: Bootstrap Recovery — Lightsail

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-2
  AWS_ACCOUNT_ID: "890876258895"
  INSTANCE_NAME: ai-recruiter-micro-prod
  IMAGE_TAG: 91d001ccd401552a83b013c5d1678fd347e319b3
  ECR_REGISTRY: 890876258895.dkr.ecr.us-east-2.amazonaws.com
  ECR_BACKEND_REPO: ai-recruiter-api
  ECR_FRONTEND_REPO: ai-recruiter-frontend
  RUNTIME_CONFIG_SECRET: /ai-recruiter/prod/runtime-config

jobs:
  recover:
    name: Recover first production bootstrap
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::890876258895:role/AiRecruiterGithubDeployRole
          aws-region: us-east-2

      - name: Load runtime and import configuration
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"
          RUNTIME_JSON=$(aws secretsmanager get-secret-value --secret-id "$RUNTIME_CONFIG_SECRET" --query SecretString --output text)
          for KEY in S3_BUCKET KNOWLEDGE_BASE_ID DATA_SOURCE_ID COGNITO_USER_POOL_ID COGNITO_CLIENT_ID; do
            VALUE=$(echo "$RUNTIME_JSON" | jq -r --arg key "$KEY" '.[$key]')
            test -n "$VALUE" && test "$VALUE" != null
            echo "$KEY=$VALUE" >> "$GITHUB_ENV"
          done
          IMPORT_STAGING_BUCKET=$(aws cloudformation describe-stacks --stack-name ai-recruiter-candidate-import --query "Stacks[0].Outputs[?OutputKey=='ImportStagingBucket'].OutputValue" --output text)
          IMPORT_QUEUE_URL=$(aws cloudformation describe-stacks --stack-name ai-recruiter-candidate-import --query "Stacks[0].Outputs[?OutputKey=='ImportQueueUrl'].OutputValue" --output text)
          echo "IMPORT_STAGING_BUCKET=$IMPORT_STAGING_BUCKET" >> "$GITHUB_ENV"
          echo "IMPORT_QUEUE_URL=$IMPORT_QUEUE_URL" >> "$GITHUB_ENV"

      - name: Acquire certified temporary SSH identity
        run: |
          set -euo pipefail
          KEY_FILE=/tmp/lightsail-key
          ACCESS_JSON=$(aws lightsail get-instance-access-details --instance-name "$INSTANCE_NAME" --protocol ssh --region "$AWS_REGION")
          echo "$ACCESS_JSON" | jq -er '.accessDetails.privateKey' > "$KEY_FILE"
          echo "$ACCESS_JSON" | jq -er '.accessDetails.certKey' > "${KEY_FILE}-cert.pub"
          chmod 600 "$KEY_FILE"
          chmod 644 "${KEY_FILE}-cert.pub"
          echo "LIGHTSAIL_KEY_FILE=$KEY_FILE" >> "$GITHUB_ENV"
          test -s "$KEY_FILE"
          test -s "${KEY_FILE}-cert.pub"

      - name: Bootstrap host and generate local runtime PKI
        run: |
          set -euo pipefail
          INSTANCE_IP=$(aws lightsail get-instance --instance-name "$INSTANCE_NAME" --region "$AWS_REGION" --query instance.publicIpAddress --output text)
          KEY_FILE="${LIGHTSAIL_KEY_FILE:?}"
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i "$KEY_FILE" ubuntu@$INSTANCE_IP 'sudo bash -s' <<'REMOTE'
            set -euo pipefail
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -y
            apt-get install -y docker.io postgresql postgresql-contrib curl unzip openssl jq
            systemctl enable --now docker postgresql
            install -d -m 755 /opt/ai-recruiter/rolesanywhere /opt/ai-recruiter/aws /run/rolesanywhere
            cd /opt/ai-recruiter/rolesanywhere
            if [ ! -s ca.crt ] || [ ! -s client.crt ] || [ ! -s client.key ]; then
              openssl req -x509 -newkey rsa:4096 -sha256 -days 3650 -nodes -keyout ca.key -out ca.crt -subj '/C=CO/O=Asiati/OU=AI Recruiter/CN=AI Recruiter Host Root CA' -addext 'basicConstraints=critical,CA:TRUE,pathlen:0' -addext 'keyUsage=critical,keyCertSign,cRLSign' -addext 'subjectKeyIdentifier=hash'
              cat > client.ext <<'EOF'
          basicConstraints=critical,CA:FALSE
          keyUsage=critical,digitalSignature
          extendedKeyUsage=clientAuth
          subjectKeyIdentifier=hash
          authorityKeyIdentifier=keyid,issuer
          EOF
              openssl req -new -newkey rsa:2048 -nodes -keyout client.key -out client.csr -subj '/C=CO/O=Asiati/OU=AI Recruiter/CN=ai-recruiter-micro-prod'
              openssl x509 -req -in client.csr -CA ca.crt -CAkey ca.key -CAcreateserial -out client.crt -days 365 -sha256 -extfile client.ext
            fi
            chmod 600 ca.key client.key
            chmod 644 ca.crt client.crt
            if ! command -v aws >/dev/null 2>&1; then
              curl -fsS https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip -o /tmp/awscliv2.zip
              rm -rf /tmp/aws
              unzip -q /tmp/awscliv2.zip -d /tmp
              /tmp/aws/install
            fi
            if [ ! -x /usr/local/bin/aws_signing_helper ]; then
              curl -fsS https://rolesanywhere.amazonaws.com/releases/1.0.3/X86_64/Linux/aws_signing_helper -o /usr/local/bin/aws_signing_helper
              chmod 755 /usr/local/bin/aws_signing_helper
            fi
            if [ ! -f /swapfile ]; then
              fallocate -l 2G /swapfile
              chmod 600 /swapfile
              mkswap /swapfile >/dev/null
              swapon /swapfile
              echo '/swapfile none swap sw 0 0' >> /etc/fstab
            else
              swapon /swapfile 2>/dev/null || true
            fi
            mkdir -p /etc/docker
            printf '%s\n' '{"log-driver":"json-file","log-opts":{"max-size":"10m","max-file":"3"}}' > /etc/docker/daemon.json
            systemctl restart docker
            PGVER=$(ls /etc/postgresql | sort -V | tail -1)
            PGCONF="/etc/postgresql/$PGVER/main/postgresql.conf"
            PGHBA="/etc/postgresql/$PGVER/main/pg_hba.conf"
            sed -ri "s/^#?listen_addresses[[:space:]]*=.*/listen_addresses = '*'/" "$PGCONF"
            grep -q '172.16.0.0/12' "$PGHBA" || echo 'host all all 172.16.0.0/12 scram-sha-256' >> "$PGHBA"
            sudo -u postgres psql -v ON_ERROR_STOP=1 -c "ALTER USER postgres PASSWORD 'postgres';"
            sudo -u postgres psql -tAc "SELECT 1 FROM pg_database WHERE datname='ai_recruiter'" | grep -q 1 || sudo -u postgres createdb ai_recruiter
            systemctl restart postgresql
          REMOTE
          scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i "$KEY_FILE" ubuntu@$INSTANCE_IP:/opt/ai-recruiter/rolesanywhere/ca.crt "$RUNNER_TEMP/host-ca.crt"

      - name: Register host CA with IAM Roles Anywhere
        run: |
          set -euo pipefail
          RUNTIME_ROLE_ARN="arn:aws:iam::${AWS_ACCOUNT_ID}:role/AiRecruiterBedrockRuntimeRole"
          CA_JSON=$(jq -Rs '{sourceType:"CERTIFICATE_BUNDLE",sourceData:{x509CertificateData:.}}' < "$RUNNER_TEMP/host-ca.crt")
          ANCHOR_ID=$(aws rolesanywhere list-trust-anchors --query "trustAnchors[?name=='ai-recruiter-prod-host-ca'].trustAnchorId | [0]" --output text)
          if [ -z "$ANCHOR_ID" ] || [ "$ANCHOR_ID" = None ]; then
            ANCHOR_JSON=$(aws rolesanywhere create-trust-anchor --name ai-recruiter-prod-host-ca --enabled --source "$CA_JSON")
            ANCHOR_ID=$(echo "$ANCHOR_JSON" | jq -r .trustAnchor.trustAnchorId)
            ANCHOR_ARN=$(echo "$ANCHOR_JSON" | jq -r .trustAnchor.trustAnchorArn)
          else
            aws rolesanywhere update-trust-anchor --trust-anchor-id "$ANCHOR_ID" --name ai-recruiter-prod-host-ca --source "$CA_JSON" >/dev/null
            ANCHOR_ARN=$(aws rolesanywhere get-trust-anchor --trust-anchor-id "$ANCHOR_ID" --query trustAnchor.trustAnchorArn --output text)
          fi
          PROFILE_ARN=$(aws rolesanywhere list-profiles --query "profiles[?name=='ai-recruiter-bedrock'].profileArn | [0]" --output text)
          if [ -z "$PROFILE_ARN" ] || [ "$PROFILE_ARN" = None ]; then
            PROFILE_ARN=$(aws rolesanywhere create-profile --name ai-recruiter-bedrock --enabled --role-arns "$RUNTIME_ROLE_ARN" --query profile.profileArn --output text)
          fi
          cat > "$RUNNER_TEMP/runtime-role-trust.json" <<EOF
          {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Service":"rolesanywhere.amazonaws.com"},"Action":["sts:AssumeRole","sts:SetSourceIdentity","sts:TagSession"],"Condition":{"ArnEquals":{"aws:SourceArn":"$ANCHOR_ARN"}}}]}
          EOF
          aws iam update-assume-role-policy --role-name AiRecruiterBedrockRuntimeRole --policy-document "file://$RUNNER_TEMP/runtime-role-trust.json"
          cat > "$RUNNER_TEMP/aws-config" <<EOF
          [profile ai-recruiter-bedrock]
          region = $AWS_REGION
          credential_process = /usr/local/bin/aws_signing_helper credential-process --certificate /run/rolesanywhere/client.crt --private-key /run/rolesanywhere/client.key --trust-anchor-arn $ANCHOR_ARN --profile-arn $PROFILE_ARN --role-arn $RUNTIME_ROLE_ARN
          EOF
          INSTANCE_IP=$(aws lightsail get-instance --instance-name "$INSTANCE_NAME" --region "$AWS_REGION" --query instance.publicIpAddress --output text)
          KEY_FILE="${LIGHTSAIL_KEY_FILE:?}"
          scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i "$KEY_FILE" "$RUNNER_TEMP/aws-config" ubuntu@$INSTANCE_IP:/tmp/ai-recruiter-aws-config
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i "$KEY_FILE" ubuntu@$INSTANCE_IP 'sudo bash -s' <<'REMOTE'
            set -euo pipefail
            install -d -m 755 /opt/ai-recruiter/aws /run/rolesanywhere /home/ubuntu/.aws
            install -m 644 /tmp/ai-recruiter-aws-config /opt/ai-recruiter/aws/config
            ln -sfn /opt/ai-recruiter/rolesanywhere/client.crt /run/rolesanywhere/client.crt
            ln -sfn /opt/ai-recruiter/rolesanywhere/client.key /run/rolesanywhere/client.key
            ln -sfn /opt/ai-recruiter/aws/config /home/ubuntu/.aws/config
            chown -R ubuntu:ubuntu /home/ubuntu/.aws
            sudo -u ubuntu aws sts get-caller-identity --profile ai-recruiter-bedrock >/tmp/sts.json
            test "$(jq -r .Account /tmp/sts.json)" = "890876258895"
            docker network inspect ai-recruiter >/dev/null 2>&1 || docker network create ai-recruiter >/dev/null
          REMOTE

      - name: Migrate and deploy containers
        run: |
          set -euo pipefail
          INSTANCE_IP=$(aws lightsail get-instance --instance-name "$INSTANCE_NAME" --region "$AWS_REGION" --query instance.publicIpAddress --output text)
          KEY_FILE="${LIGHTSAIL_KEY_FILE:?}"
          scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i "$KEY_FILE" scripts/deploy-api.sh scripts/deploy-worker.sh ubuntu@$INSTANCE_IP:/tmp/
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i "$KEY_FILE" ubuntu@$INSTANCE_IP bash -s <<REMOTE
            set -euo pipefail
            ECR_REGISTRY="$ECR_REGISTRY"
            TAG="$IMAGE_TAG"
            aws ecr get-login-password --region "$AWS_REGION" --profile ai-recruiter-bedrock | sudo docker login --username AWS --password-stdin "$ECR_REGISTRY"
            sudo docker pull "$ECR_REGISTRY/$ECR_BACKEND_REPO:$IMAGE_TAG"
            sudo docker pull "$ECR_REGISTRY/$ECR_FRONTEND_REPO:$IMAGE_TAG"
            sudo docker run --rm --network ai-recruiter --add-host=host.docker.internal:host-gateway -e DATABASE_URL=postgresql://postgres:postgres@host.docker.internal:5432/ai_recruiter "$ECR_REGISTRY/$ECR_BACKEND_REPO:$IMAGE_TAG" python -m app.scripts.migrate_candidate_import
            chmod +x /tmp/deploy-api.sh /tmp/deploy-worker.sh
            AWS_ACCOUNT_ID="$AWS_ACCOUNT_ID" ECR_TAG="$IMAGE_TAG" IMPORT_STAGING_BUCKET="$IMPORT_STAGING_BUCKET" IMPORT_QUEUE_URL="$IMPORT_QUEUE_URL" IMPORT_EVALUATION_CONCURRENCY=1 S3_BUCKET="$S3_BUCKET" KNOWLEDGE_BASE_ID="$KNOWLEDGE_BASE_ID" DATA_SOURCE_ID="$DATA_SOURCE_ID" COGNITO_USER_POOL_ID="$COGNITO_USER_POOL_ID" COGNITO_CLIENT_ID="$COGNITO_CLIENT_ID" sudo -E /tmp/deploy-api.sh
            AWS_ACCOUNT_ID="$AWS_ACCOUNT_ID" ECR_TAG="$IMAGE_TAG" IMPORT_STAGING_BUCKET="$IMPORT_STAGING_BUCKET" IMPORT_QUEUE_URL="$IMPORT_QUEUE_URL" IMPORT_EVALUATION_CONCURRENCY=1 S3_BUCKET="$S3_BUCKET" KNOWLEDGE_BASE_ID="$KNOWLEDGE_BASE_ID" DATA_SOURCE_ID="$DATA_SOURCE_ID" COGNITO_USER_POOL_ID="$COGNITO_USER_POOL_ID" COGNITO_CLIENT_ID="$COGNITO_CLIENT_ID" sudo -E /tmp/deploy-worker.sh
            sudo docker rm -f ai-recruiter-web 2>/dev/null || true
            sudo docker run -d --name ai-recruiter-web --network ai-recruiter --restart unless-stopped -p 80:80 "$ECR_REGISTRY/$ECR_FRONTEND_REPO:$IMAGE_TAG"
            for i in \$(seq 1 20); do
              if curl -fsS http://127.0.0.1/ >/dev/null; then break; fi
              sleep 2
            done
            curl -fsS http://127.0.0.1/ >/dev/null
          REMOTE

      - name: Verify public app
        run: |
          set -euo pipefail
          IP=$(aws lightsail get-instance --instance-name "$INSTANCE_NAME" --region "$AWS_REGION" --query instance.publicIpAddress --output text)
          for i in $(seq 1 20); do
            CODE=$(curl -sS -o /dev/null -w '%{http_code}' "http://$IP/api/health" || true)
            [ "$CODE" = 200 ] && break
            sleep 3
          done
          test "$CODE" = 200
          curl -fsS "http://$IP/" | grep -q root
          echo "RECOVERY_DEPLOY_OK http://$IP"

      - name: Remove temporary SSH material
        if: always()
        run: rm -f /tmp/lightsail-key /tmp/lightsail-key-cert.pub
