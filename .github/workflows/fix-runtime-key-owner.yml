name: Fix Runtime Key Owner

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  fix:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::890876258895:role/AiRecruiterGithubDeployRole
          aws-region: us-east-2

      - name: Fix host key ownership
        run: |
          set -euo pipefail
          ACCESS_JSON=$(aws lightsail get-instance-access-details --instance-name ai-recruiter-micro-prod --protocol ssh --region us-east-2)
          KEY_FILE=/tmp/lightsail-key
          echo "$ACCESS_JSON" | jq -er '.accessDetails.privateKey' > "$KEY_FILE"
          echo "$ACCESS_JSON" | jq -er '.accessDetails.certKey' > "${KEY_FILE}-cert.pub"
          chmod 600 "$KEY_FILE"
          chmod 644 "${KEY_FILE}-cert.pub"
          IP=$(aws lightsail get-instance --instance-name ai-recruiter-micro-prod --region us-east-2 --query instance.publicIpAddress --output text)
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i "$KEY_FILE" ubuntu@$IP 'sudo chown ubuntu:ubuntu /opt/ai-recruiter/rolesanywhere/client.key /opt/ai-recruiter/rolesanywhere/client.crt && sudo chmod 600 /opt/ai-recruiter/rolesanywhere/client.key && sudo chmod 644 /opt/ai-recruiter/rolesanywhere/client.crt && test -r /opt/ai-recruiter/rolesanywhere/client.key'
          rm -f "$KEY_FILE" "${KEY_FILE}-cert.pub"
          echo HOST_RUNTIME_KEY_OWNER_OK
