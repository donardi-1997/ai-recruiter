name: Feature CI — Indeed Resume Bridge

on:
  push:
    branches:
      - feat/indeed-email-resume-bridge

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-xdist
      - env:
          DATABASE_URL: "sqlite:///:memory:"
        run: python -m pytest app/tests/ -n 2 --dist=loadfile -q --tb=short

  postgres-migration-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_recruiter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d ai_recruiter_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/ai_recruiter_test"
        run: python -m pytest app/tests/test_postgres_migrations.py -q --tb=short
