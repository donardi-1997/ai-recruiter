name: Feature CI — Indeed Resume Bridge

on:
  push:
    branches:
      - feat/indeed-email-resume-bridge

permissions:
  contents: read

# verification marker: task-2-green
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-xdist
      - env:
          DATABASE_URL: "sqlite:///:memory:"
        run: python -m pytest app/tests/ -n 2 --dist=loadfile -q --tb=short
