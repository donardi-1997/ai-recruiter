name: Final verify — Indeed Resume Bridge

on:
  push:
    branches:
      - feat/indeed-email-resume-bridge

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.10"

jobs:
  backend-per-file:
    name: Backend diagnostic — one file per process
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest alembic psycopg2-binary
      - name: Run every backend test file in a fresh Python process
        env:
          DATABASE_URL: "sqlite:///:memory:"
          PYTHONFAULTHANDLER: "1"
          PYTHONUNBUFFERED: "1"
        run: |
          set -uo pipefail
          while IFS= read -r file; do
            echo "::group::${file}"
            set +e
            timeout --signal=TERM --kill-after=5s 60s \
              python -m pytest "${file}" -vv --tb=short --maxfail=1
            rc=$?
            set -e
            echo "::endgroup::"
            if [ "$rc" -ne 0 ]; then
              echo "::error file=${file}::pytest file failed or hung; exit=${rc}"
              exit "$rc"
            fi
          done < <(find app/tests -maxdepth 1 -type f -name 'test_*.py' | sort)

  backend-full-serial:
    name: Backend diagnostic — full serial hard timeout
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest alembic psycopg2-binary
      - name: Run full serial suite with OS hard timeout
        env:
          DATABASE_URL: "sqlite:///:memory:"
          PYTHONFAULTHANDLER: "1"
          PYTHONUNBUFFERED: "1"
        run: |
          set +e
          timeout --signal=TERM --kill-after=5s 180s \
            python -m pytest app/tests/ -vv --tb=short --maxfail=1 --durations=25
          rc=$?
          set -e
          if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
            echo "::error::Full serial pytest exceeded 180s; inspect the last STARTED test above"
          fi
          exit "$rc"

  backend-full-xdist:
    name: Backend diagnostic — full xdist x2 hard timeout
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-xdist alembic psycopg2-binary
      - name: Run full xdist suite with OS hard timeout
        env:
          DATABASE_URL: "sqlite:///:memory:"
          PYTHONFAULTHANDLER: "1"
          PYTHONUNBUFFERED: "1"
        run: |
          set +e
          timeout --signal=TERM --kill-after=5s 180s \
            python -m pytest app/tests/ \
              -n 2 \
              --dist=loadfile \
              -vv \
              --tb=short \
              --maxfail=1 \
              --max-worker-restart=0 \
              --durations=25
          rc=$?
          set -e
          if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
            echo "::error::Full xdist pytest exceeded 180s; inspect the last worker tests above"
          fi
          exit "$rc"
