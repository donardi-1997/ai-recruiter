name: Frontend CI/CD
on:
  pull_request:
    branches: [main]
    paths:
      - "frontend-react/**"
      - "Dockerfile.frontend"
      - "frontend-task-definition.json"
      - ".github/workflows/frontend.yml"
  push:
    branches: [main]
    paths:
      - "frontend-react/**"
      - "Dockerfile.frontend"
      - "frontend-task-definition.json"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: production-frontend
  cancel-in-progress: false
env:
  AWS_REGION: us-east-2
  ECR_REPOSITORY: ai-recruiter-frontend
  ECS_CLUSTER: ai-recruiter-cluster
  ECS_SERVICE: ai-recruiter-frontend
  ECS_CONTAINER: ai-recruiter-frontend
  # Nuevo flujo:
  # Frontend ALB -> /api/* -> API ECS
  VITE_API_URL: /api
jobs:
  validate:
    name: Validate frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json
      - name: Install dependencies
        working-directory: frontend-react
        run: npm ci
      - name: Build React application
        working-directory: frontend-react
        env:
          VITE_API_URL: ${{ env.VITE_API_URL }}
        run: npm run build
      - name: Validate task definition JSON
        run: |
          python -m json.tool frontend-task-definition.json > /dev/null
      - name: Build frontend Docker image
        run: |
          docker build \
            --file Dockerfile.frontend \
            --build-arg VITE_API_URL="$VITE_API_URL" \
            --tag frontend-ci:${{ github.sha }} .
  deploy:
    name: Deploy frontend
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push image
        id: image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build \
            --file Dockerfile.frontend \
            --build-arg VITE_API_URL="$VITE_API_URL" \
            --tag "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          echo "uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"
      - name: Render ECS task definition
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: frontend-task-definition.json
          container-name: ${{ env.ECS_CONTAINER }}
          image: ${{ steps.image.outputs.uri }}
      - name: Deploy ECS service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
      - name: Verify deployment
        run: |

          aws ecs describe-services \
          --cluster "$ECS_CLUSTER" \
          --services "$ECS_SERVICE" \
          --region "$AWS_REGION" \
          --query "services[0].deployments[*].{Status:status,Running:runningCount,Task:taskDefinition}" \
          --output table
