name: Frontend CI/CD
on:
  pull_request:
    branches: [main]
    paths:
      - "frontend-react/**"
      - ".github/workflows/frontend.yml"
  push:
    branches: [main]
    paths:
      - "frontend-react/**"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: production-frontend
  cancel-in-progress: false
env:
  AWS_REGION: us-east-2
  S3_BUCKET: ai-recruiter-frontend-765761474007
  CLOUDFRONT_DISTRIBUTION_ID: E1IBIX4EWENEP7
  VITE_API_URL: /api
jobs:
  validate:
    name: Validate frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json
      - name: Install dependencies
        working-directory: frontend-react
        run: npm ci
      - name: Build React application
        working-directory: frontend-react
        env:
          VITE_API_URL: ${{ env.VITE_API_URL }}
        run: npm run build
  deploy:
    name: Deploy frontend
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json
      - name: Build production frontend
        working-directory: frontend-react
        env:
          VITE_API_URL: ${{ env.VITE_API_URL }}
        run: |
          npm ci
          npm run build
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Publish versioned assets
        run: |
          aws s3 sync frontend-react/dist/ "s3://$S3_BUCKET" \
            --delete \
            --exclude "index.html" \
            --cache-control "public,max-age=31536000,immutable"
      - name: Publish application shell
        run: |
          aws s3 cp frontend-react/dist/index.html "s3://$S3_BUCKET/index.html" \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/html"
      - name: Refresh CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*"
