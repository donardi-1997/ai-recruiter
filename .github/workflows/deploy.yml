name: CI/CD — Tests & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  AWS_ACCOUNT_ID: "765761474007"
  ECR_BACKEND_REPO: ai-recruiter-api
  ECR_FRONTEND_REPO: ai-recruiter-frontend
  SERVICE_NAME: ai-recruiter-api

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Validate syntax
        run: python -m py_compile app/main.py
      - name: Run tests
        env:
          DATABASE_URL: "sqlite:///:memory:"
        run: python -m pytest app/tests/ -v --tb=short

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json
      - name: Install deps
        working-directory: frontend-react
        run: npm ci
      - name: Lint
        working-directory: frontend-react
        run: npm run lint
      - name: Test
        working-directory: frontend-react
        run: npm test
      - name: Build
        working-directory: frontend-react
        env:
          VITE_API_URL: /api
        run: npm run build

  deploy:
    name: Deploy to Lightsail
    if: github.event_name != 'pull_request'
    needs: [backend-tests, frontend-tests]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker build --tag "$ECR_REGISTRY/$ECR_BACKEND_REPO:latest" .
          docker push "$ECR_REGISTRY/$ECR_BACKEND_REPO:latest"

      - name: Build and push frontend image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker build --tag "$ECR_REGISTRY/$ECR_FRONTEND_REPO:latest" ./frontend-react
          docker push "$ECR_REGISTRY/$ECR_FRONTEND_REPO:latest"

      - name: Enable ECR access on container service
        run: |
          aws lightsail update-container-service \
            --service-name $SERVICE_NAME \
            --is-enabled \
            --private-registry-access '{"ecrImagePullerRole":{"isActive":true}}' \
            --region $AWS_REGION || true

      - name: Wait for service to be ready
        run: |
          echo "Waiting for service to be READY..."
          for i in $(seq 1 30); do
            STATE=$(aws lightsail get-container-services \
              --service-name $SERVICE_NAME \
              --region $AWS_REGION \
              --query "containerServices[0].state" \
              --output text)
            echo "State: $STATE"
            if [ "$STATE" = "READY" ]; then
              echo "Service is ready!"
              break
            fi
            sleep 10
          done

      - name: Deploy to Lightsail Container Service
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          aws lightsail create-container-service-deployment \
            --service-name $SERVICE_NAME \
            --region $AWS_REGION \
            --containers "{
              \"api\": {
                \"image\": \"$ECR_REGISTRY/$ECR_BACKEND_REPO:latest\",
                \"environment\": {
                  \"DATABASE_URL\": \"${{ secrets.DATABASE_URL }}\",
                  \"AWS_REGION\": \"$AWS_REGION\",
                  \"COGNITO_USER_POOL_ID\": \"${{ secrets.COGNITO_USER_POOL_ID }}\",
                  \"COGNITO_CLIENT_ID\": \"${{ secrets.COGNITO_CLIENT_ID }}\"
                },
                \"ports\": {
                  \"8000\": \"HTTP\"
                }
              },
              \"web\": {
                \"image\": \"$ECR_REGISTRY/$ECR_FRONTEND_REPO:latest\",
                \"ports\": {
                  \"80\": \"HTTP\"
                }
              }
            }" \
            --public-endpoint "{
              \"containerName\": \"web\",
              \"containerPort\": 80,
              \"healthCheck\": {
                \"path\": \"/api/health\",
                \"successCodes\": \"200\"
              }
            }"

      - name: Wait for deployment
        run: |
          echo "Waiting for deployment to stabilize..."
          sleep 60
          for i in $(seq 1 30); do
            STATE=$(aws lightsail get-container-service-deployments \
              --service-name $SERVICE_NAME \
              --region $AWS_REGION \
              --query "deployments[0].state" \
              --output text)
            echo "Deployment state: $STATE"
            if [ "$STATE" = "ACTIVE" ]; then
              echo "Deployment active!"
              break
            fi
            sleep 10
          done

      - name: Health check
        run: |
          URL=$(aws lightsail get-container-services \
            --service-name $SERVICE_NAME \
            --region $AWS_REGION \
            --query "containerServices[0].url" \
            --output text)
          echo "Service URL: $URL"
          HTTP_CODE=$(curl -sf -o /dev/null -w "%{http_code}" "${URL}api/health" || echo "000")
          echo "Health check: HTTP $HTTP_CODE"
