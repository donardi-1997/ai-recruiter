name: CI/CD — Tests & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  AWS_ACCOUNT_ID: "765761474007"
  ECR_BACKEND_REPO: ai-recruiter-api
  ECR_FRONTEND_REPO: ai-recruiter-frontend
  INSTANCE_NAME: ai-recruiter-micro-canary
  CLOUDFRONT_DISTRIBUTION_ID: E1IBIX4EWENEP7

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Validate syntax
        run: |
          python -m py_compile app/main.py
          python -m py_compile app/evaluation.py
      - name: Run tests
        env:
          DATABASE_URL: "sqlite:///:memory:"
        run: python -m pytest app/tests/ -v --tb=short

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json
      - name: Install deps
        working-directory: frontend-react
        run: npm ci
      - name: Lint
        working-directory: frontend-react
        run: npm run lint
      - name: Test
        working-directory: frontend-react
        run: npx vitest run
      - name: Build
        working-directory: frontend-react
        env:
          VITE_API_URL: /api
        run: npm run build

  deploy:
    name: Deploy to Lightsail
    needs: [backend-tests, frontend-tests]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/GitHubActionsDeployRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$ECR_REGISTRY/$ECR_BACKEND_REPO:$IMAGE_TAG" .
          docker push "$ECR_REGISTRY/$ECR_BACKEND_REPO:$IMAGE_TAG"

      - name: Build and push frontend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --build-arg VITE_API_URL=/api \
            -t "$ECR_REGISTRY/$ECR_FRONTEND_REPO:$IMAGE_TAG" \
            ./frontend-react
          docker push "$ECR_REGISTRY/$ECR_FRONTEND_REPO:$IMAGE_TAG"

      - name: Resolve production host
        id: host
        run: |
          HOST=$(aws lightsail get-instance --instance-name "$INSTANCE_NAME" --query 'instance.publicIpAddress' --output text)
          test -n "$HOST" && test "$HOST" != "None"
          echo "host=$HOST" >> "$GITHUB_OUTPUT"

      - name: Prepare SSH key
        run: |
          aws ssm get-parameter --name /ai-recruiter/production/ssh-private-key --with-decryption --query Parameter.Value --output text > /tmp/ai-recruiter-key
          chmod 600 /tmp/ai-recruiter-key

      - name: Copy backend deploy script
        run: |
          scp -o StrictHostKeyChecking=no -i /tmp/ai-recruiter-key scripts/deploy-api.sh ubuntu@${{ steps.host.outputs.host }}:/tmp/deploy-api.sh

      - name: Deploy backend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          ssh -o StrictHostKeyChecking=no -i /tmp/ai-recruiter-key ubuntu@${{ steps.host.outputs.host }} \
            "chmod +x /tmp/deploy-api.sh && ECR_REGISTRY='$ECR_REGISTRY' ECR_BACKEND_REPO='$ECR_BACKEND_REPO' IMAGE_TAG='$IMAGE_TAG' AWS_REGION='$AWS_REGION' /tmp/deploy-api.sh"

      - name: Deploy frontend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          ssh -o StrictHostKeyChecking=no -i /tmp/ai-recruiter-key ubuntu@${{ steps.host.outputs.host }} \
            "set -euo pipefail; \
            aws ecr get-login-password --region '$AWS_REGION' | docker login --username AWS --password-stdin '$ECR_REGISTRY'; \
            docker pull '$ECR_REGISTRY/$ECR_FRONTEND_REPO:$IMAGE_TAG'; \
            OLD_IMAGE=\$(docker inspect ai-recruiter-frontend --format '{{.Config.Image}}' 2>/dev/null || true); \
            docker stop ai-recruiter-frontend 2>/dev/null || true; \
            docker rm ai-recruiter-frontend 2>/dev/null || true; \
            docker run -d --name ai-recruiter-frontend --restart unless-stopped -p 127.0.0.1:8080:80 '$ECR_REGISTRY/$ECR_FRONTEND_REPO:$IMAGE_TAG'; \
            for i in \$(seq 1 20); do curl -fsS http://127.0.0.1:8080/ >/dev/null && break; sleep 2; done; \
            curl -fsS http://127.0.0.1:8080/ >/dev/null; \
            docker inspect ai-recruiter-frontend --format '{{.Config.Image}}' | grep -F '$IMAGE_TAG'; \
            docker tag '$ECR_REGISTRY/$ECR_FRONTEND_REPO:$IMAGE_TAG' '$ECR_REGISTRY/$ECR_FRONTEND_REPO:latest'; \
            if [ -n \"\$OLD_IMAGE\" ]; then docker image inspect \"\$OLD_IMAGE\" >/dev/null 2>&1 || true; fi"

      - name: Verify public frontend
        run: |
          curl --retry 10 --retry-delay 3 --retry-all-errors -fsS https://air.adrianguerra.net/ >/dev/null

      - name: Invalidate CloudFront
        run: |
          INVALIDATION_ID=$(aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths '/*' --query 'Invalidation.Id' --output text)
          aws cloudfront wait invalidation-completed --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --id "$INVALIDATION_ID"

      - name: Remove SSH key
        if: always()
        run: rm -f /tmp/ai-recruiter-key
