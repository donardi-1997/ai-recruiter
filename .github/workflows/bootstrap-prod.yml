name: Production Bootstrap

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-prod.yml
      - scripts/deploy-api.sh
      - scripts/deploy-worker.sh
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-bootstrap
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  AWS_ACCOUNT_ID: "890876258895"
  INSTANCE_NAME: ai-recruiter-micro-prod
  IMAGE_TAG: 91d001ccd401552a83b013c5d1678fd347e319b3
  RUNTIME_CONFIG_SECRET: /ai-recruiter/prod/runtime-config

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::890876258895:role/AiRecruiterGithubDeployRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Load runtime configuration
        run: |
          set -euo pipefail
          ACTUAL=$(aws sts get-caller-identity --query Account --output text)
          [ "$ACTUAL" = "$AWS_ACCOUNT_ID" ]
          RUNTIME_JSON=$(aws secretsmanager get-secret-value --secret-id "$RUNTIME_CONFIG_SECRET" --query SecretString --output text)
          for KEY in S3_BUCKET KNOWLEDGE_BASE_ID DATA_SOURCE_ID COGNITO_USER_POOL_ID COGNITO_CLIENT_ID; do
            VALUE=$(echo "$RUNTIME_JSON" | jq -r --arg key "$KEY" '.[$key]')
            test -n "$VALUE" && test "$VALUE" != "null"
            echo "$KEY=$VALUE" >> "$GITHUB_ENV"
          done
          STACK_JSON=$(aws cloudformation describe-stacks --stack-name ai-recruiter-candidate-import)
          IMPORT_STAGING_BUCKET=$(echo "$STACK_JSON" | jq -r '.Stacks[0].Outputs[] | select(.OutputKey=="ImportStagingBucket") | .OutputValue')
          IMPORT_QUEUE_URL=$(echo "$STACK_JSON" | jq -r '.Stacks[0].Outputs[] | select(.OutputKey=="ImportQueueUrl") | .OutputValue')
          echo "IMPORT_STAGING_BUCKET=$IMPORT_STAGING_BUCKET" >> "$GITHUB_ENV"
          echo "IMPORT_QUEUE_URL=$IMPORT_QUEUE_URL" >> "$GITHUB_ENV"

      - name: Acquire certified Lightsail SSH credentials
        run: |
          set -euo pipefail
          ACCESS_JSON=$(aws lightsail get-instance-access-details --instance-name "$INSTANCE_NAME" --protocol ssh --region "$AWS_REGION")
          KEY_FILE=/tmp/lightsail-key
          CERT_FILE=/tmp/lightsail-key-cert.pub
          echo "$ACCESS_JSON" | jq -er '.accessDetails.privateKey' > "$KEY_FILE"
          echo "$ACCESS_JSON" | jq -er '.accessDetails.certKey' > "$CERT_FILE"
          chmod 600 "$KEY_FILE"
          chmod 644 "$CERT_FILE"
          SSH_USER=$(echo "$ACCESS_JSON" | jq -er '.accessDetails.username')
          INSTANCE_IP=$(echo "$ACCESS_JSON" | jq -er '.accessDetails.ipAddress')
          echo "LIGHTSAIL_KEY_FILE=$KEY_FILE" >> "$GITHUB_ENV"
          echo "LIGHTSAIL_CERT_FILE=$CERT_FILE" >> "$GITHUB_ENV"
          echo "LIGHTSAIL_SSH_USER=$SSH_USER" >> "$GITHUB_ENV"
          echo "INSTANCE_IP=$INSTANCE_IP" >> "$GITHUB_ENV"

      - name: Bootstrap host
        run: |
          set -euo pipefail
          SSH=(-i "$LIGHTSAIL_KEY_FILE" -o "CertificateFile=$LIGHTSAIL_CERT_FILE" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null)
          ssh "${SSH[@]}" "$LIGHTSAIL_SSH_USER@$INSTANCE_IP" 'sudo bash -s' <<'REMOTE'
            set -euo pipefail
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -y
            apt-get install -y docker.io postgresql postgresql-contrib curl unzip openssl jq
            systemctl enable --now docker postgresql
            if [ ! -f /swapfile ]; then
              fallocate -l 2G /swapfile
              chmod 600 /swapfile
              mkswap /swapfile >/dev/null
              swapon /swapfile
              echo '/swapfile none swap sw 0 0' >> /etc/fstab
            else
              swapon /swapfile 2>/dev/null || true
            fi
            mkdir -p /etc/docker
            cat >/etc/docker/daemon.json <<'EOF'
          {"log-driver":"json-file","log-opts":{"max-size":"10m","max-file":"3"}}
          EOF
            systemctl restart docker
            mkdir -p /opt/ai-recruiter/rolesanywhere /opt/ai-recruiter/aws /run/rolesanywhere
            if [ ! -s /opt/ai-recruiter/rolesanywhere/ca.crt ]; then
              cd /opt/ai-recruiter/rolesanywhere
              openssl req -x509 -newkey rsa:4096 -sha256 -days 3650 -nodes -keyout ca.key -out ca.crt \
                -subj '/C=CO/O=Asiati/OU=AI Recruiter/CN=AI Recruiter Host Root CA' \
                -addext 'basicConstraints=critical,CA:TRUE,pathlen:0' \
                -addext 'keyUsage=critical,keyCertSign,cRLSign' \
                -addext 'subjectKeyIdentifier=hash'
              cat >client.ext <<'EOF'
          basicConstraints=critical,CA:FALSE
          keyUsage=critical,digitalSignature
          extendedKeyUsage=clientAuth
          subjectKeyIdentifier=hash
          authorityKeyIdentifier=keyid,issuer
          EOF
              openssl req -new -newkey rsa:2048 -nodes -keyout client.key -out client.csr \
                -subj '/C=CO/O=Asiati/OU=AI Recruiter/CN=ai-recruiter-micro-prod'
              openssl x509 -req -in client.csr -CA ca.crt -CAkey ca.key -CAcreateserial \
                -out client.crt -days 365 -sha256 -extfile client.ext
              chmod 600 ca.key client.key
              chmod 644 ca.crt client.crt
            fi
            if ! command -v aws >/dev/null 2>&1; then
              curl -fsS https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip -o /tmp/awscliv2.zip
              rm -rf /tmp/aws
              unzip -q /tmp/awscliv2.zip -d /tmp
              /tmp/aws/install
            fi
            if [ ! -x /usr/local/bin/aws_signing_helper ]; then
              curl -fsS https://rolesanywhere.amazonaws.com/releases/1.0.3/X86_64/Linux/aws_signing_helper -o /usr/local/bin/aws_signing_helper
              chmod 755 /usr/local/bin/aws_signing_helper
            fi
            PGVER=$(ls /etc/postgresql | sort -V | tail -1)
            PGCONF="/etc/postgresql/$PGVER/main/postgresql.conf"
            PGHBA="/etc/postgresql/$PGVER/main/pg_hba.conf"
            sed -ri "s/^#?listen_addresses[[:space:]]*=.*/listen_addresses = '*'/" "$PGCONF"
            grep -q '172.16.0.0/12' "$PGHBA" || echo 'host all all 172.16.0.0/12 scram-sha-256' >> "$PGHBA"
            sudo -u postgres psql -v ON_ERROR_STOP=1 -c "ALTER USER postgres PASSWORD 'postgres';"
            sudo -u postgres psql -tAc "SELECT 1 FROM pg_database WHERE datname='ai_recruiter'" | grep -q 1 || sudo -u postgres createdb ai_recruiter
            sudo -u postgres psql -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET shared_buffers='64MB';"
            sudo -u postgres psql -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET work_mem='2MB';"
            sudo -u postgres psql -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET maintenance_work_mem='32MB';"
            sudo -u postgres psql -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET effective_cache_size='192MB';"
            sudo -u postgres psql -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET max_connections='20';"
            systemctl restart postgresql
          REMOTE

      - name: Configure Roles Anywhere
        run: |
          set -euo pipefail
          SSH=(-i "$LIGHTSAIL_KEY_FILE" -o "CertificateFile=$LIGHTSAIL_CERT_FILE" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null)
          scp "${SSH[@]}" "$LIGHTSAIL_SSH_USER@$INSTANCE_IP:/opt/ai-recruiter/rolesanywhere/ca.crt" /tmp/host-ca.crt
          CA_JSON=$(jq -Rs '{sourceType:"CERTIFICATE_BUNDLE",sourceData:{x509CertificateData:.}}' </tmp/host-ca.crt)
          ANCHOR_ID=$(aws rolesanywhere list-trust-anchors --query "trustAnchors[?name=='ai-recruiter-prod-host-ca'].trustAnchorId | [0]" --output text)
          if [ -z "$ANCHOR_ID" ] || [ "$ANCHOR_ID" = None ]; then
            ANCHOR_JSON=$(aws rolesanywhere create-trust-anchor --name ai-recruiter-prod-host-ca --enabled --source "$CA_JSON")
            ANCHOR_ID=$(echo "$ANCHOR_JSON" | jq -r '.trustAnchor.trustAnchorId')
          else
            aws rolesanywhere update-trust-anchor --trust-anchor-id "$ANCHOR_ID" --name ai-recruiter-prod-host-ca --source "$CA_JSON" >/dev/null
          fi
          ANCHOR_ARN=$(aws rolesanywhere get-trust-anchor --trust-anchor-id "$ANCHOR_ID" --query 'trustAnchor.trustAnchorArn' --output text)
          PROFILE_ARN=$(aws rolesanywhere list-profiles --query "profiles[?name=='ai-recruiter-bedrock'].profileArn | [0]" --output text)
          if [ -z "$PROFILE_ARN" ] || [ "$PROFILE_ARN" = None ]; then
            PROFILE_ARN=$(aws rolesanywhere create-profile --name ai-recruiter-bedrock --enabled \
              --role-arns "arn:aws:iam::$AWS_ACCOUNT_ID:role/AiRecruiterBedrockRuntimeRole" --query 'profile.profileArn' --output text)
          fi
          cat >/tmp/runtime-trust.json <<EOF
          {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Service":"rolesanywhere.amazonaws.com"},"Action":["sts:AssumeRole","sts:SetSourceIdentity","sts:TagSession"],"Condition":{"ArnEquals":{"aws:SourceArn":"$ANCHOR_ARN"}}}]}
          EOF
          aws iam update-assume-role-policy --role-name AiRecruiterBedrockRuntimeRole --policy-document file:///tmp/runtime-trust.json
          cat >/tmp/aws-config <<EOF
          [profile ai-recruiter-bedrock]
          region = $AWS_REGION
          credential_process = /usr/local/bin/aws_signing_helper credential-process --certificate /run/rolesanywhere/client.crt --private-key /run/rolesanywhere/client.key --trust-anchor-arn $ANCHOR_ARN --profile-arn $PROFILE_ARN --role-arn arn:aws:iam::$AWS_ACCOUNT_ID:role/AiRecruiterBedrockRuntimeRole
          EOF
          scp "${SSH[@]}" /tmp/aws-config "$LIGHTSAIL_SSH_USER@$INSTANCE_IP:/tmp/aws-config"
          ssh "${SSH[@]}" "$LIGHTSAIL_SSH_USER@$INSTANCE_IP" 'sudo bash -s' <<'REMOTE'
            set -euo pipefail
            install -d -m 755 /opt/ai-recruiter/aws /run/rolesanywhere /home/ubuntu/.aws
            install -m 644 /tmp/aws-config /opt/ai-recruiter/aws/config
            ln -sfn /opt/ai-recruiter/rolesanywhere/client.crt /run/rolesanywhere/client.crt
            ln -sfn /opt/ai-recruiter/rolesanywhere/client.key /run/rolesanywhere/client.key
            ln -sfn /opt/ai-recruiter/aws/config /home/ubuntu/.aws/config
            chown -R ubuntu:ubuntu /home/ubuntu/.aws
            sudo -u ubuntu aws sts get-caller-identity --profile ai-recruiter-bedrock >/tmp/sts.json
            test "$(jq -r .Account /tmp/sts.json)" = "890876258895"
            docker network inspect ai-recruiter >/dev/null 2>&1 || docker network create ai-recruiter >/dev/null
          REMOTE

      - name: Migrate and deploy
        run: |
          set -euo pipefail
          SSH=(-i "$LIGHTSAIL_KEY_FILE" -o "CertificateFile=$LIGHTSAIL_CERT_FILE" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null)
          REGISTRY="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
          scp "${SSH[@]}" scripts/deploy-api.sh "$LIGHTSAIL_SSH_USER@$INSTANCE_IP:/tmp/deploy-api.sh"
          scp "${SSH[@]}" scripts/deploy-worker.sh "$LIGHTSAIL_SSH_USER@$INSTANCE_IP:/tmp/deploy-worker.sh"
          ssh "${SSH[@]}" "$LIGHTSAIL_SSH_USER@$INSTANCE_IP" bash -s <<REMOTE
            set -euo pipefail
            export AWS_DEFAULT_REGION="$AWS_REGION"
            REGISTRY="$REGISTRY"
            TAG="$IMAGE_TAG"
            aws ecr get-login-password --region "$AWS_REGION" --profile ai-recruiter-bedrock | sudo docker login --username AWS --password-stdin "\$REGISTRY"
            sudo docker pull "\$REGISTRY/ai-recruiter-api:\$TAG"
            sudo docker pull "\$REGISTRY/ai-recruiter-frontend:\$TAG"
            sudo docker run --rm --network ai-recruiter --add-host=host.docker.internal:host-gateway \
              -e PYTHONPATH=/app -e DATABASE_URL=postgresql://postgres:postgres@host.docker.internal:5432/ai_recruiter \
              -w /app/app "\$REGISTRY/ai-recruiter-api:\$TAG" alembic -c alembic.ini upgrade head
            chmod +x /tmp/deploy-api.sh /tmp/deploy-worker.sh
            AWS_ACCOUNT_ID="$AWS_ACCOUNT_ID" ECR_TAG="\$TAG" IMPORT_STAGING_BUCKET="$IMPORT_STAGING_BUCKET" IMPORT_QUEUE_URL="$IMPORT_QUEUE_URL" \
              S3_BUCKET="$S3_BUCKET" KNOWLEDGE_BASE_ID="$KNOWLEDGE_BASE_ID" DATA_SOURCE_ID="$DATA_SOURCE_ID" \
              COGNITO_USER_POOL_ID="$COGNITO_USER_POOL_ID" COGNITO_CLIENT_ID="$COGNITO_CLIENT_ID" sudo -E /tmp/deploy-api.sh
            AWS_ACCOUNT_ID="$AWS_ACCOUNT_ID" ECR_TAG="\$TAG" IMPORT_STAGING_BUCKET="$IMPORT_STAGING_BUCKET" IMPORT_QUEUE_URL="$IMPORT_QUEUE_URL" \
              S3_BUCKET="$S3_BUCKET" KNOWLEDGE_BASE_ID="$KNOWLEDGE_BASE_ID" DATA_SOURCE_ID="$DATA_SOURCE_ID" \
              COGNITO_USER_POOL_ID="$COGNITO_USER_POOL_ID" COGNITO_CLIENT_ID="$COGNITO_CLIENT_ID" sudo -E /tmp/deploy-worker.sh
            sudo docker rm -f ai-recruiter-web >/dev/null 2>&1 || true
            sudo docker run -d --name ai-recruiter-web --network ai-recruiter --restart unless-stopped -p 80:80 "\$REGISTRY/ai-recruiter-frontend:\$TAG"
            for i in \$(seq 1 20); do curl -fsS http://127.0.0.1/api/health >/dev/null && break; sleep 2; done
            curl -fsS http://127.0.0.1/api/health
            curl -fsS http://127.0.0.1/ | grep -q root
            sudo docker ps --format '{{.Names}} {{.Status}}'
          REMOTE

      - name: Verify public endpoint
        run: |
          set -euo pipefail
          curl -fsS "http://$INSTANCE_IP/api/health"
          curl -fsS "http://$INSTANCE_IP/" | grep -q root
          echo "PRODUCTION_BOOTSTRAP_OK http://$INSTANCE_IP"

      - name: Cleanup SSH credentials
        if: always()
        run: rm -f /tmp/lightsail-key /tmp/lightsail-key-cert.pub /tmp/host-ca.crt /tmp/aws-config
