name: Debug — isolate worker sleep from xdist

on:
  push:
    branches:
      - feat/indeed-email-resume-bridge

permissions:
  contents: write

jobs:
  red-green-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/indeed-email-resume-bridge
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-xdist
      - name: RED — prove isolated sleep hook is missing
        env:
          DATABASE_URL: "sqlite:///:memory:"
        run: |
          set +e
          python -m pytest app/tests/test_candidate_import_sleep_isolation.py -q --tb=short
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "Expected RED test to fail before implementation"
            exit 1
          fi
          echo "RED confirmed"
      - name: Implement isolated retry sleep hook
        run: |
          python - <<'PY'
          from pathlib import Path

          worker_path = Path('app/workers/candidate_imports.py')
          worker = worker_path.read_text(encoding='utf-8')

          marker = 'def _sleep(seconds: float) -> None:'
          if marker not in worker:
              anchor = '''PUBLIC_NO_USABLE_CANDIDATES_MESSAGE = (\n    "No fue posible preparar candidatos utilizables para esta importacion."\n)\n\n\n'''
              helper = '''PUBLIC_NO_USABLE_CANDIDATES_MESSAGE = (\n    "No fue posible preparar candidatos utilizables para esta importacion."\n)\n\n\ndef _sleep(seconds: float) -> None:\n    """Sleep without exposing the stdlib time module as a test patch point."""\n    time.sleep(seconds)\n\n\n'''
              if anchor not in worker:
                  raise SystemExit('sleep helper insertion anchor not found')
              worker = worker.replace(anchor, helper, 1)

              replacements = {
                  '        time.sleep(max(0.0, poll_interval_seconds))': '        _sleep(max(0.0, poll_interval_seconds))',
                  '        time.sleep(EVALUATION_RETRY_DELAYS[attempt])': '        _sleep(EVALUATION_RETRY_DELAYS[attempt])',
                  '            time.sleep(RANKING_RETRY_DELAYS[attempt])': '            _sleep(RANKING_RETRY_DELAYS[attempt])',
              }
              for old, new in replacements.items():
                  if old not in worker:
                      raise SystemExit(f'expected worker sleep call not found: {old}')
                  worker = worker.replace(old, new, 1)
              worker_path.write_text(worker, encoding='utf-8')

          test_path = Path('app/tests/test_candidate_import_evaluation_worker.py')
          tests = test_path.read_text(encoding='utf-8')
          old = 'monkeypatch.setattr(worker.time, "sleep", lambda seconds: sleeps.append(seconds))'
          new = 'monkeypatch.setattr(worker, "_sleep", lambda seconds: sleeps.append(seconds))'
          count = tests.count(old)
          if count not in (0, 3):
              raise SystemExit(f'unexpected worker.time.sleep patch count: {count}')
          if count == 3:
              tests = tests.replace(old, new)
              test_path.write_text(tests, encoding='utf-8')
          PY
      - name: GREEN — focused retry tests under xdist
        env:
          DATABASE_URL: "sqlite:///:memory:"
        run: |
          python -m pytest \
            app/tests/test_candidate_import_sleep_isolation.py \
            app/tests/test_candidate_import_evaluation_transaction_boundary.py \
            app/tests/test_candidate_import_evaluation_worker.py \
            -n 2 --dist=loadfile -v --tb=short
      - name: Commit tested fix
        run: |
          if git diff --quiet -- app/workers/candidate_imports.py app/tests/test_candidate_import_evaluation_worker.py; then
            echo "No implementation changes to commit"
            exit 0
          fi
          git config user.name "Adrian Felipe Guerra"
          git config user.email "adrianguerra9703@gmail.com"
          git add app/workers/candidate_imports.py app/tests/test_candidate_import_evaluation_worker.py
          git diff --cached --check
          git commit -m "fix: isolate candidate import retry sleep from xdist"
          git push origin HEAD:feat/indeed-email-resume-bridge
