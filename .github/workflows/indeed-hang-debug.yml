name: Debug — fix candidate import evaluation lock

on:
  push:
    branches:
      - feat/indeed-email-resume-bridge

permissions:
  contents: write

jobs:
  apply-fix-and-test:
    if: ${{ !contains(github.event.head_commit.message, 'fix: release evaluation coordinator transaction') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/indeed-email-resume-bridge
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-xdist
      - name: Release coordinator read transaction before threaded writes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/workers/candidate_imports.py')
          text = path.read_text(encoding='utf-8')

          old_head = '''    candidate_ids = _successful_candidate_ids(db, batch)\n    outstanding = [\n        candidate_id\n        for candidate_id in candidate_ids\n        if not _terminal_evaluation_for_batch(db, batch, candidate_id)[0]\n    ]\n\n    if outstanding:\n        max_workers = max(1, int(get_import_evaluation_concurrency()))\n'''
          new_head = '''    # Snapshot ORM-backed scalars before releasing the coordinator session.\n    # The reads below autobegin a transaction; keeping it open while child\n    # sessions write can deadlock SQLite and unnecessarily retain a DB snapshot.\n    batch_id = batch.id\n    job_id = batch.job_id\n    owner_sub = batch.owner_sub\n\n    candidate_ids = _successful_candidate_ids(db, batch)\n    outstanding = [\n        candidate_id\n        for candidate_id in candidate_ids\n        if not _terminal_evaluation_for_batch(db, batch, candidate_id)[0]\n    ]\n\n    if outstanding:\n        db.rollback()\n        max_workers = max(1, int(get_import_evaluation_concurrency()))\n'''
          old_submit = '''                    candidate_id=candidate_id,\n                    job_id=batch.job_id,\n                    owner_sub=batch.owner_sub,\n'''
          new_submit = '''                    candidate_id=candidate_id,\n                    job_id=job_id,\n                    owner_sub=owner_sub,\n'''
          old_reload = '''    db.expire_all()\n    batch = repository.get_batch_for_worker(db, batch.id)\n'''
          new_reload = '''    db.expire_all()\n    batch = repository.get_batch_for_worker(db, batch_id)\n'''

          for old, new, label in (
              (old_head, new_head, 'evaluation stage head'),
              (old_submit, new_submit, 'worker submit args'),
              (old_reload, new_reload, 'post-worker reload'),
          ):
              if old not in text:
                  raise SystemExit(f'expected {label} snippet not found')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Verify regression and worker contracts
        env:
          DATABASE_URL: "sqlite:///:memory:"
        run: |
          python -m pytest \
            app/tests/test_candidate_import_evaluation_transaction_boundary.py \
            app/tests/test_candidate_import_evaluation_worker.py \
            -q --tb=short
      - name: Commit tested fix
        run: |
          git config user.name "Adrian Felipe Guerra"
          git config user.email "adrianguerra9703@gmail.com"
          git add app/workers/candidate_imports.py
          git diff --cached --check
          git commit -m "fix: release evaluation coordinator transaction before worker writes"
          git push origin HEAD:feat/indeed-email-resume-bridge
