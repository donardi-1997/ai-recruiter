name: Debug — candidate import evaluation hang

on:
  push:
    branches:
      - feat/indeed-email-resume-bridge

permissions:
  contents: read

jobs:
  regression-red-green:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-xdist
      - name: Run coordinator transaction regression
        env:
          DATABASE_URL: "sqlite:///:memory:"
        run: |
          python -m pytest \
            app/tests/test_candidate_import_evaluation_transaction_boundary.py \
            -q --tb=short
