name: Debug — candidate import evaluation hang

on:
  push:
    branches:
      - feat/indeed-email-resume-bridge

permissions:
  contents: read

jobs:
  full-suite-xdist:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-xdist
      - name: Reproduce full-suite xdist hang with faulthandler
        env:
          DATABASE_URL: "sqlite:///:memory:"
        run: |
          timeout -k 5s 60s python -m pytest app/tests/ \
            -n 2 --dist=loadfile -vv -s --tb=long \
            -o faulthandler_timeout=15
