AWSTemplateFormatVersion: '2010-09-09'
Description: GitHub Actions OIDC provider and deploy role for ai-recruiter

Parameters:
  GitHubOrg:
    Type: String
    Default: donardi-1997
  RepositoryName:
    Type: String
    Default: ai-recruiter
  MainBranch:
    Type: String
    Default: refs/heads/main
  AwsAccountId:
    Type: String
    Default: '765761474007'

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 227203b5317f3818cab5b5ce596132bf36748c0e

  GitHubActionsDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ai-recruiter-github-actions-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:aws:iam::${AwsAccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubOrg}/${RepositoryName}:ref:${MainBranch}
      Policies:
        - PolicyName: ai-recruiter-deploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: PushProjectImages
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:CompleteLayerUpload
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource: !Sub arn:aws:ecr:us-east-2:${AwsAccountId}:repository/ai-recruiter
              - Sid: GetEcrAuthorizationToken
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Sid: DeployEcsServices
                Effect: Allow
                Action:
                  - ecs:DescribeServices
                  - ecs:DescribeTaskDefinition
                  - ecs:RegisterTaskDefinition
                  - ecs:UpdateService
                Resource: '*'
              - Sid: PassOnlyProjectTaskRoles
                Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !Sub arn:aws:iam::${AwsAccountId}:role/ai-recruiter-ecs-execution-role
                  - !Sub arn:aws:iam::${AwsAccountId}:role/ai-recruiter-ecs-task-role
                Condition:
                  StringEquals:
                    iam:PassedToService: ecs-tasks.amazonaws.com
              - Sid: ListFrontendBucket
                Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource: !Sub arn:aws:s3:::ai-recruiter-frontend-${AwsAccountId}
              - Sid: PublishFrontendObjects
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:DeleteObject
                Resource: !Sub arn:aws:s3:::ai-recruiter-frontend-${AwsAccountId}/*
              - Sid: InvalidateFrontendDistribution
                Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Sub arn:aws:cloudfront::${AwsAccountId}:distribution/E2D9QVT3763I47

Outputs:
  RoleArn:
    Description: ARN of the GitHub Actions deploy role
    Value: !GetAtt GitHubActionsDeployRole.Arn
    Export:
      Name: GitHubActionsDeployRoleArn
  OidcProviderArn:
    Description: ARN of the GitHub OIDC provider
    Value: !Ref GitHubOidcProvider
